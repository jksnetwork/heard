name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-good desktop-file-utils appstream
      - name: Unit tests
        run: python3 -m unittest discover -v tests
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
      - name: Shell scripts parse
        run: for f in install.sh bin/heard tools/nested-shell.sh packaging/build-deb.sh; do bash -n "$f"; done
      - name: Build the Debian package
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
