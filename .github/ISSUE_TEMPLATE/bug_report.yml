name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The details below make it much quicker to fix.
        Security problem? Please [report it privately](https://github.com/jksnetwork/heard/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Clicked into a terminal, pressed Shift+Super+H, spoke, pressed it again
        2. Expected the text to be typed
        3. The pill said "Transcribing…" and nothing appeared
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop
      options:
        - GNOME
        - KDE Plasma
        - Hyprland
        - Sway
        - Other
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Where does the speech engine run?
      description: Shown under "Speech engine" in the debug info below.
      options:
        - NVIDIA GPU (CUDA)
        - CPU
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Heard?
      options:
        - One-line installer
        - From source (./install.sh)
        - .deb package
        - Other
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: >
        In the tray menu, open **About Heard → Troubleshooting** and copy the debug info, then paste it here.
        It shows your Heard version, desktop, speech engine and whether the GNOME extension is running.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If you can, run `heard quit; HEARD_DEBUG=1 heard daemon` in a terminal, reproduce the problem,
        and paste what it prints. It shows timings, the microphone level and any errors (never what you said).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Your microphone, model and language settings, or screenshots, if they seem relevant.
